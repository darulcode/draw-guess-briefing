<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join Game | Draw & Guess</title><link rel="stylesheet" href="/public/css/base.css"></head>
<body>
  <main class="page narrow">
    <nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D!</span> Draw & Guess</a></nav>
    <section class="card accent center"><span class="pill">Room <b id="joinRoomCode"></b></span><h2 style="margin-top:16px">Siap ikut main?</h2><p class="muted">Pakai nama yang mudah dikenali teman satu tim.</p>
      <form id="joinForm" class="stack" style="text-align:left"><div class="field"><label for="playerName">Nama kamu</label><input id="playerName" class="input" minlength="2" maxlength="20" autocomplete="name" placeholder="Contoh: Ahmad" required autofocus></div><div id="joinError" class="form-error"></div><button id="joinButton" class="btn secondary" type="submit">Join Game</button></form>
    </section>
  </main>
  <div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/public/js/common.js"></script><script src="/public/js/join.js"></script>
</body>
</html>
