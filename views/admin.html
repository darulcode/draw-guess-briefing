<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Buat Room | Draw & Guess</title><link rel="stylesheet" href="/public/css/base.css"></head>
<body>
  <main class="page narrow">
    <nav class="topbar"><a class="brand" href="/"><span class="brand-mark">D!</span> Draw & Guess</a><a class="btn ghost small" href="/">Kembali</a></nav>
    <section class="card accent">
      <span class="pill">Host setup</span><h2 style="margin-top:14px">Siapkan arena bermain</h2><p class="muted">Atur satu sesi, lalu undang peserta dengan QR atau Room ID.</p>
      <form id="createRoomForm" class="stack" autocomplete="off">
        <div class="field"><label for="sessionName">Nama sesi</label><input id="sessionName" class="input" maxlength="50" value="Briefing Pagi" required></div>
        <div class="grid two">
          <div class="field"><label for="maxRound">Jumlah ronde</label><input id="maxRound" class="input" type="number" min="1" max="20" value="5" required></div>
          <div class="field"><label for="duration">Durasi per ronde</label><select id="duration" class="select"><option value="30">30 detik</option><option value="60" selected>60 detik</option><option value="90">90 detik</option><option value="120">120 detik</option></select></div>
        </div>
        <div class="field"><label for="wordMode">Mode kata</label><select id="wordMode" class="select"><option value="manual">Manual atau random saat ronde</option><option value="random">Random dari bank kata</option></select></div>
        <div id="formError" class="form-error" role="alert"></div><button id="createButton" class="btn secondary" type="submit">Buat Room Sekarang</button>
      </form>
    </section>
  </main>
  <div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/public/js/common.js"></script><script src="/public/js/admin-create.js"></script>
</body>
</html>
