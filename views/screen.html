<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game Room | Draw & Guess</title><link rel="stylesheet" href="/public/css/base.css"><link rel="stylesheet" href="/public/css/screen.css?v=20260619c"></head>
<body class="screen-body">
  <main class="screen-page">
    <header class="screen-topbar"><div class="brand"><span class="brand-mark">D!</span><h1 id="screenTitle" class="screen-title">Draw & Guess</h1></div><div class="screen-top-actions"><span id="screenStatus" class="eyebrow">Waiting room</span><button id="screenUnlock" class="btn ghost small">Aktifkan Kontrol Host</button><button id="screenPrimaryAction" class="btn success screen-primary-action hidden">Start Ronde</button></div></header>
    <section id="screenWaiting" class="screen-waiting"><div class="center"><img id="screenQr" class="qr" alt="QR code join"><p class="white">Scan QR untuk Join</p></div><div><span class="eyebrow">Room ID</span><div id="screenRoomCode" class="screen-room-code">------</div><h2 class="white"><span id="screenPlayerCount">0</span> peserta sudah masuk</h2><div id="screenParticipants" class="screen-participants"></div></div></section>
    <section id="screenGame" class="screen-game-grid hidden"><div class="canvas-frame screen-canvas locked"><canvas id="screenCanvas"></canvas></div><aside class="screen-side"><div class="screen-metric"><span>Ronde</span><strong id="screenRound">1 / 5</strong></div><div class="screen-metric"><span>Penggambar</span><strong id="screenDrawer">-</strong></div><div class="screen-metric"><span>Sudah benar</span><strong id="screenCorrect">0</strong></div><div id="screenTimer" class="timer">--:--</div></aside></section>
    <section id="screenResult" class="screen-result hidden"></section><section id="screenFinal" class="screen-result hidden center"></section>
  </main>
  <div id="screenPinModal" class="screen-pin-modal hidden"><form id="screenPinForm" class="card screen-pin-card"><span class="pill">Host access</span><h2>Aktifkan kontrol game</h2><p class="muted">Masukkan PIN admin room. PIN default adalah 1234.</p><div class="field"><label for="screenHostPin">PIN host</label><input id="screenHostPin" class="input" type="password" inputmode="numeric" minlength="4" maxlength="8" placeholder="Masukkan PIN" required></div><div id="screenPinError" class="form-error"></div><div class="input-group"><button class="btn success" type="submit">Aktifkan Kontrol</button><button id="screenPinCancel" class="btn ghost" type="button">Batal</button></div></form></div>
  <div id="screenCountdown" class="countdown-overlay hidden"><div id="screenCountdownNumber" class="countdown-number">3</div></div><canvas id="confettiCanvas" class="confetti-canvas"></canvas><div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script><script src="/public/js/common.js"></script><script src="/public/js/canvas.js"></script><script src="/public/js/confetti.js"></script><script src="/public/js/screen.js?v=20260619c"></script>
</body>
</html>
